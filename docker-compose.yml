# Local development stack.
#
# Everything here is LOCAL ONLY. The credentials below are development defaults, committed so the
# stack starts with no .env file; deployed environments take the datasource credentials from Key
# Vault through the Secrets Store CSI driver.
#
#   docker compose up -d postgres wiremock    # dependencies, for ./gradlew bootRun
#   docker compose up -d                      # the service in its container as well
#
# `wiremock` stands in for every Common Platform API the service calls: usersgroups (the caller's
# court centres and the permissions lookup made by the authorisation filter), reference data,
# listing, hearing and progression. Its stubs in docker/wiremock/ are the ones the integration
# test uses, so a local run answers exactly as the tests expect. Try:
#
#   curl -H 'CJSCPPUID: 77777777-7777-4777-8777-777777777777' \
#     'http://localhost:4550/bulkresulting/hearings?ouCode=B01AA00&startDate=<a date in the next 28 days>'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4550:4550"
    environment:
      SERVER_PORT: 4550
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bulkresulting
      SPRING_DATASOURCE_USERNAME: bulkresulting
      SPRING_DATASOURCE_PASSWORD: bulkresulting
      CP_BASE_URL: http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bulkresulting
      POSTGRES_USER: bulkresulting
      POSTGRES_PASSWORD: bulkresulting
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkresulting -d bulkresulting"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8080:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock
    command: ["--global-response-templating", "--disable-banner"]

volumes:
  postgres-data:
